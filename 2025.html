    position: sticky;
    top: 0;

  thead th:hover { color: #f59e0b; }

    font-size: 10px;
    color: #475569;

    border-bottom: none;

  tbody tr {

  }

    white-space: nowrap;

  tbody td:first-child { text-align: center; color: #64748b; font-size: 12px; width: 44px; }
  tbody td:nth-child(2) { text-align: left; }

  .rank-medal { font-size: 16px; }

  .player-name {
    font-weight: 600;
    color: #f1f5f9;
    font-size: 13.5px;
  }
  .player-link {
    color: #f1f5f9;
    text-decoration: none;
  }
  .player-link:hover { color: #f59e0b; text-decoration: underline; }

  td.key-col {
    color: #fbbf24;
    font-weight: 700;

  .heat-mid  { color: #fbbf24; }
  .heat-low  { color: #60a5fa; }

  th.section-start {
    border-left: 1px solid #1e3a5f;
  }
  td.section-start {
    border-left: 1px solid #1e3a5f;

// numeric columns
const NUM_COLS = ['attempts','avg_hit_angle','anglesweetspotpercent','max_hit_speed','avg_hit_speed','ev50','max_distance','avg_distance','avg_hr_distance','ev95plus','ev95percent','barrels','brl_percent','brl_pa'];

let sortCol = 'max_hit_speed';
let sortDir = 1; // 1 = desc (highest first)
let searchQ = '';

const SAVANT_BASE = 'https://baseballsavant.mlb.com/savant-player/';

function val(row, col) {
  const v = parseFloat(row[col]);
  return isNaN(v) ? -Infinity : v;
}

function medal(i) {
  if (i === 0) return '<span class="rank-medal">🥇</span>';
  if (i === 1) return '<span class="rank-medal">🥈</span>';
  if (i === 2) return '<span class="rank-medal">🥉</span>';
  return i + 1;
}

function fmt(row, col) {
  const v = row[col];
  if (v === '' || v === null || v === undefined) return '<span style="color:#475569">—</span>';
  return v;
}

function render() {
  const q = searchQ.toLowerCase();
  let data = RAW.filter(r => r.name.toLowerCase().includes(q));

  data.sort((a, b) => {
    const av = val(a, sortCol);
    const bv = val(b, sortCol);
    if (sortCol === 'name') {
      return sortDir * a.name.localeCompare(b.name);
    }
    return sortDir * (bv - av);
  });

  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyMsg');

  if (data.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    document.getElementById('countBadge').textContent = '共 0 筆';
    return;
  }
  empty.style.display = 'none';
  document.getElementById('countBadge').textContent = `共 ${data.length} 筆`;

  // compute ranges for coloring max_hit_speed, brl_percent
  const speeds = data.map(r => val(r, 'max_hit_speed')).filter(v => v > 0);
  const minSpeed = Math.min(...speeds), maxSpeed = Math.max(...speeds);

  tbody.innerHTML = data.map((row, i) => {
    const spd = val(row, 'max_hit_speed');
    const ratio = maxSpeed > minSpeed ? (spd - minSpeed) / (maxSpeed - minSpeed) : 0;
    const speedClass = ratio > 0.66 ? 'heat-high' : ratio > 0.33 ? 'heat-mid' : '';

    const savantUrl = `${SAVANT_BASE}${row.name.toLowerCase().replace(/[^a-z ]/g,'').replace(/ /g,'-')}-${row.player_id}`;

    return `<tr>
      <td>${medal(i)}</td>
      <td class="player-name"><a class="player-link" href="${savantUrl}" target="_blank" rel="noopener">${row.name}</a></td>
      <td>${fmt(row,'attempts')}</td>
      <td class="section-start">${fmt(row,'avg_hit_angle')}°</td>
      <td>${fmt(row,'anglesweetspotpercent')}%</td>
      <td class="key-col ${speedClass}">${fmt(row,'max_hit_speed')}</td>
      <td>${fmt(row,'avg_hit_speed')}</td>
      <td class="section-start">${fmt(row,'ev50')}</td>
      <td class="section-start">${fmt(row,'max_distance')}</td>
      <td>${fmt(row,'avg_distance')}</td>
      <td>${fmt(row,'avg_hr_distance')}</td>
      <td class="section-start">${fmt(row,'ev95plus')}</td>
      <td>${fmt(row,'ev95percent')}%</td>
      <td class="section-start">${fmt(row,'barrels')}</td>
      <td>${fmt(row,'brl_percent')}%</td>
      <td>${fmt(row,'brl_pa')}%</td>
    </tr>`;
  }).join('');
}

// sort on header click
document.getElementById('headerRow').addEventListener('click', e => {
  const th = e.target.closest('th');
  if (!th) return;
  const col = th.dataset.col;
  if (!col || col === 'rank') return;

  document.querySelectorAll('#headerRow th').forEach(h => {
    h.classList.remove('sorted');
    const arrow = h.querySelector('.sort-arrow');
    if (arrow) arrow.remove();
  });

  if (sortCol === col) {
    sortDir *= -1;
  } else {
    sortCol = col;
sortDir = NUM_COLS.includes(col) ? 1 : -1;
  }

  th.classList.add('sorted');
  const arrow = document.createElement('span');
  arrow.className = 'sort-arrow';
  arrow.textContent = sortDir === -1 ? '▼' : '▲';
  th.appendChild(arrow);

  render();
});

document.getElementById('searchInput').addEventListener('input', e => {
  searchQ = e.target.value;
  render();
});

render();
</script>
</body>
</html>
